# Root project configuration
sonar.projectKey=com.revshop:revshop-microservices
sonar.projectName=Revshop Microservices
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source and binary paths (standard for Maven projects)
sonar.sources=src/main/java
sonar.java.binaries=target/classes

# Multi-module modules
sonar.modules=api-gateway,user-service,cart-service,order-service,payment-service,product-service,notification-service,config-server,eureka-server

# Individual module definitions
api-gateway.sonar.projectKey=com.revshop:api-gateway
user-service.sonar.projectKey=com.revshop:user-service
cart-service.sonar.projectKey=com.revshop:cart-service
order-service.sonar.projectKey=com.revshop:order-service
payment-service.sonar.projectKey=com.revshop:payment-service
product-service.sonar.projectKey=com.revshop:product-service
notification-service.sonar.projectKey=com.revshop:notification-service
config-server.sonar.projectKey=com.revshop:config-server
eureka-server.sonar.projectKey=com.revshop:eureka-server
