<div class="forgot-wrapper">

  <div class="forgot-card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to receive OTP</p>

    <form (ngSubmit)="sendOtp()">
      <input type="email"
             class="form-control"
             placeholder="Enter your email"
             [(ngModel)]="email"
             name="email"
             required>

      <button type="submit" class="btn-send">
        Send OTP
      </button>
    </form>
  </div>

</div>
