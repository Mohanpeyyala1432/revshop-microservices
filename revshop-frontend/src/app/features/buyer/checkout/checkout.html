<div *ngIf="orderSuccess" class="success-wrapper">
  <div class="success-box">
    <div class="success-icon">✅</div>
    <h2>Order Placed Successfully!</h2>
    <p>Your order has been confirmed.</p>
  </div>
</div>

<div class="checkout-container">


  <h2>Checkout</h2>

  <div class="form-group">
    <label>Shipping Address</label>
    <textarea [(ngModel)]="shippingAddress"></textarea>
  </div>

  <div class="form-group">
    <label>Billing Address</label>
    <textarea [(ngModel)]="billingAddress"></textarea>
  </div>

  <div class="form-group">
  <label>Payment Method</label>
  <select [(ngModel)]="type">
    <option value="COD">Cash on Delivery</option>
    <option value="DEBIT_CARD">Debit Card</option>
    <option value="CREDIT_CARD">Credit Card</option>
    <option value="UPI">UPI</option>
  </select>
</div>

<!-- Card Section -->
<div *ngIf="type === 'DEBIT_CARD' || type === 'CREDIT_CARD'"
     class="card-section">

  <input type="text"
         placeholder="Card Number"
         [(ngModel)]="cardNumber">

  <input type="text"
         placeholder="Card Holder Name"
         [(ngModel)]="cardHolderName">

  <input type="text"
         placeholder="Expiry (MM/YY)"
         [(ngModel)]="cardExpiry">

</div>

<!-- UPI Section -->
<div *ngIf="type === 'UPI'" class="card-section">
  <input type="text"
         placeholder="UPI ID (e.g., user@paytm)"
         [(ngModel)]="upiId">
</div>

  <button type="button" (click)="placeOrder()">
    Place Order
  </button>

</div>
