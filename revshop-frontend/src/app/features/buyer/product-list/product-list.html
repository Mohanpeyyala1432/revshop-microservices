<div class="navbar">

  <div class="logo">
    RevShop
  </div>

  <div class="search-section">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchText"
       (input)="searchProducts()"
    />
    <button (click)="searchProducts()">Search</button>
  </div>

  <div class="notification-wrapper">

  <button class="notif-btn" (click)="toggleNotifications()">
    🔔
    <span *ngIf="unreadCount > 0" class="badge">
      {{ unreadCount }}
    </span>
  </button>

  <div class="notif-dropdown" *ngIf="showNotifications">

    <div *ngIf="notifications.length === 0" class="empty">
      No notifications
    </div>

    <div class="notif-item"
         *ngFor="let n of notifications"
         [class.unread]="!n.readStatus"
         (click)="markAsRead(n)">

      <p>{{ n.message }}</p>
      <small>{{ n.createdAt | date:'short' }}</small>

    </div>

  </div>

</div>

  <div class="nav-right">
    <button (click)="goToCart()">Cart 🛒</button>

    <button (click)="goToOrders()">Orders 📦</button>
    
    <button (click)="goToWishlist()">Wishlist</button>
    <button (click)="logout()">Logout</button>
  </div>

</div>

<div class="category-section">
 

  <button
    *ngFor="let cat of categories"
    [class.active]="selectedCategory === cat.categoryName"
    (click)="selectCategory(cat.categoryName)">
    {{ cat.categoryName }}
  </button>
</div>


<div class="product-container">

  <div class="product-grid">
    <div class="product-card" *ngFor="let product of products"
    (click)="viewProduct(product.productName)">

      <img
        *ngIf="product.imageName"
        [src]="'/uploads/' + product.imageName"
        alt="Product Image"
      />

      <h3>{{ product.productName }}</h3>
      
      <p class="price">₹ {{ product.price }}</p>
      
<div class="rating" *ngIf="product.reviewCount > 0">

  <span class="stars">
    <ng-container *ngFor="let star of [1,2,3,4,5]">
      <span
        [class.filled]="star <= product.averageRating">
        ★
      </span>
    </ng-container>
  </span>

  <span class="review-count">
    ({{ product.reviewCount }} reviews)
  </span>

</div>

<div class="rating" *ngIf="product.reviewCount === 0">
  No reviews yet
</div>

      <div class="card-buttons">
        <button class="cart-btn" (click)="addToCart(product);$event.stopPropagation()">
          Add to Cart
        </button>

        <button class="wishlist-btn"
        (click)="addToWishlist(product.productId); $event.stopPropagation()">
   Wishlist
</button>

    </div>
  </div>

</div>
